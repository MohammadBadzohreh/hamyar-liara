name: acceptance
on:
  push:
    branches: ['codex/repair-*', 'main']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fixed behavior checks
        run: timeout 60s node --test test/checkout.test.mjs
